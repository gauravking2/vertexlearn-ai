name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm test -- --ci
        working-directory: backend
        env:
          JWT_ACCESS_SECRET: ci-access-secret-min-16-chars
          JWT_REFRESH_SECRET: ci-refresh-secret-min-16-chars
          BCRYPT_ROUNDS: 4
      - run: npm run build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: Node 24 is required for the frontend TEST runtime only:
      # jsdom@30 → undici@8 needs worker_threads.markAsUncloneable, which
      # does not exist on Node 20 (remote CI failure 2026-09-18). Product
      # code still supports >=20 (see engines + backend job on Node 20).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ai-service
      - run: python -m pytest -q
        working-directory: ai-service
        env:
          LLM_PROVIDER: mock

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run verify:compose
        working-directory: backend
        env:
          JWT_ACCESS_SECRET: ci-access-secret-min-16-chars
          JWT_REFRESH_SECRET: ci-refresh-secret-min-16-chars
      - name: Validate compose config (static only, throwaway placeholders)
        # .env.ci feeds ${VAR:?} interpolation; an EMPTY .env satisfies the
        # services' `env_file: ../.env` references (absent on runners — secrets
        # are never committed). The trap guarantees both throwaway files are
        # removed even if validation fails (runner uses bash -e, which would
        # otherwise skip cleanup). Safe because a tracked .env can never exist
        # (gitignored + never committed).
        run: |
          trap 'rm -f .env.ci .env' EXIT
          printf 'POSTGRES_PASSWORD=ci-placeholder\nREDIS_PASSWORD=ci-placeholder\nMINIO_ROOT_USER=ci-placeholder\nMINIO_ROOT_PASSWORD=ci-placeholder\n' > .env.ci
          touch .env
          docker compose --env-file .env.ci -f infra/docker-compose.yml config --quiet
