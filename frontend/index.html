<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VertexLearn AI</title>
    <script>
      // Pre-paint theme: apply persisted/system dark mode before first paint
      // to avoid a light flash for dark users. Mirrors themeStore logic.
      try {
        var s = JSON.parse(localStorage.getItem('theme-storage') || '{}');
        var m = (s.state && s.state.mode) || 'system';
        if (m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <script>
      // GitHub Pages SPA restore: 404.html stores the deep link in
      // sessionStorage then bounces to the base path; replay it here before
      // React Router boots so refresh / direct navigation works on static
      // hosting. No-op locally (key absent) and preserves all routes.
      try {
        var redirect = sessionStorage.getItem('vl-spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('vl-spa-redirect');
          var base = '/vertexlearn-ai';
          var here = window.location.pathname;
          var atBase = here === base || here === base + '/';
          if (atBase && redirect.charAt(0) === '/') {
            window.history.replaceState(null, '', base + redirect);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
