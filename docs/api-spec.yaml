    put:
      summary: Mark one notification read (owner only; cross-user reads 404)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated }
        '404': { description: Not found }
  /api/v1/notifications/email-status:
    get:
      summary: Email provider availability probe (never fabricates delivery)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Provider status }
  /api/v1/notifications/test-email:
    post:
