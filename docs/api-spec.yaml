    get:
      summary: Access-checked signed playback URL (enrolled/owner/admin; honest unavailable state without storage backend; production HLS/CDN out of scope)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Signed URL or unavailable state }
        '403': { description: Enrollment required }
        '404': { description: Lecture not found or no video attached }
