        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Announcements }
        '403': { description: Enrollment required }
        '404': { description: Course not found }
    post:
      summary: Publish an announcement (own course instructor or admin; notifies enrolled students)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Announcement created }
        '403': { description: Not the course owner }
        '404': { description: Course not found }
  /api/v1/notifications/me:
    get:
      summary: List my notifications (user_id always from JWT; never another user's)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: My notifications }
        '401': { description: Unauthorized }
  /api/v1/notifications/unread-count:
    get:
      summary: My unread notification count
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Unread count }
  /api/v1/notifications/read-all:
    put:
      summary: Mark all my notifications read
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated count }
