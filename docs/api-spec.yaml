      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated }
        '403': { description: Not the author }
        '404': { description: Post not found }
    delete:
      summary: Delete a post (author, course-owner instructor, or admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '403': { description: Not authorized }
        '404': { description: Post not found }
  /api/v1/discussions/posts/{postId}/flag:
    post:
      summary: Flag/report a post (one flag per reporter)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Flagged }
        '403': { description: Enrollment required or already flagged }
        '404': { description: Post not found }
  /api/v1/discussions/posts/{postId}/moderate:
    put:
      summary: Instructor moderation within own course (hide|unhide|delete; admins platform-wide)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Moderated }
        '403': { description: Not the course instructor }
        '404': { description: Post not found }
  /api/v1/courses/{courseId}/announcements:
    get:
      summary: List announcements (enrolled student, owner instructor, or admin)
