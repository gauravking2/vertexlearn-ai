    post:
      summary: Mint a presigned PUT for a lecture video asset (own course instructor or admin; stores video_key)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Upload target with presigned URL }
        '403': { description: Not the course owner }
        '404': { description: Lecture not found }
