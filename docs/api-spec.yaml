        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Reviews + aggregate }
        '404': { description: Course not found }
    post:
      summary: Submit/update my review (enrolled student, owner, or admin; one per student per course)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Review saved }
        '400': { description: Rating out of range }
        '403': { description: Enrollment required }
        '404': { description: Course not found }
  /api/v1/admin/payments:
    get:
      summary: List payment records (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Payments }
        '403': { description: Admin only }
    post:
      summary: Record a payment (admin only; real ingress for revenue analytics; no gateway)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Payment recorded }
        '403': { description: Admin only }
        '404': { description: User or course not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
