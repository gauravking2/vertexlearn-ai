      parameters:
        - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Thread + posts }
        '403': { description: Enrollment required }
        '404': { description: Thread not found }
  /api/v1/discussions/threads/{threadId}/posts:
    post:
