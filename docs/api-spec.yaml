      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Delivery report }
  /api/v1/assignments/{id}/upload:
    post:
      summary: Binary assignment upload (multipart file field; PDF/ZIP/code-text with magic-byte checks; bytes to object storage, metadata in Postgres)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Submitted with storage backend metadata }
        '400': { description: Missing file, type not accepted, or over size limit }
