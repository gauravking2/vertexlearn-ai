# VertexLearn AI — Render Blueprint (deployment readiness, no secrets committed).
#
# Target production architecture:
#   Frontend  -> GitHub Pages (https://gauravking2.github.io/vertexlearn-ai/)
#                built by .github/workflows/deploy-pages.yml, NOT Render.
#   Backend   -> Render Web Service (Docker, ./backend)
#   AI        -> Render Web Service (Docker, ./ai-service)
#   Database  -> Render PostgreSQL (managed; enable pgvector extension)
#   Redis     -> Render Key Value / Redis (REDIS_URL; optional — backend runs
#                with in-memory fallback when unset)
#   Storage   -> S3-compatible (Cloudflare R2 preferred). The backend already
#                speaks arbitrary S3 endpoints via STORAGE_ENDPOINT, so R2 works
#                with no code change: set endpoint to
#                https://<account-id>.r2.cloudflarestorage.com, region auto,
#                STORAGE_FORCE_PATH_STYLE=false, plus R2 keys/buckets.
#
# After `render blueprint apply` (or dashboard Blueprint deploy):
#   1. Set every remaining `sync: false` value in the Render dashboard
#      (never in git): GEMINI_API_KEY, AI_TUTOR_API_KEY, STORAGE_*.
#      Internal secrets (JWT_*, AI_SERVICE_TOKEN) are Render-generated.
#   2. AI_SERVICE_TOKEN is generated ONCE on the backend
#      (generateValue: true) and injected into the ai-service via
#      fromService envVarKey — never pasted manually, never in git.
#   3. FRONTEND_URL must be the BARE origin https://gauravking2.github.io
#      (no path, no trailing slash). Browsers send Origin as scheme+host
#      only, so a path suffix (/vertexlearn-ai) can never match and the
#      browser blocks login as Network Error. The /vertexlearn-ai subpath
#      is handled by the frontend Router basename, not by CORS.
#   4. AI_SERVICE_URL on the backend must be the ai-service public URL
#      (default below assumes the ai-service name; update if renamed).
#   5. AI providers are unchanged: LLM_PROVIDER=gemini (GEMINI_API_KEY),
#      AI_TUTOR_PROVIDER=openrouter (AI_TUTOR_API_KEY), embeddings
#      gemini-embedding-001 @ VECTOR(1536). Keys stay server-side.
#   6. On the managed Postgres, run once as owner:
#        CREATE EXTENSION IF NOT EXISTS vector;
#      (backend migration 003 also issues it idempotently; the manual step is
#      belt-and-braces for locked-down instances).
#   7. Backend runs `npm run migrate:prod && node dist/index.js` from its
#      Dockerfile CMD (idempotent IF NOT EXISTS migrations) and binds
#      0.0.0.0 on $PORT. AI binds 0.0.0.0 on ${PORT:-8000}.

services:
  - type: web
    name: vertexlearn-backend
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Bare browser origin (CORS compares the Origin header exactly:
      # scheme + host, never a subpath). The Pages subpath is a frontend
      # Router concern, not a CORS origin.
      - key: FRONTEND_URL
        value: https://gauravking2.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: vertexlearn-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vertexlearn-redis
          property: connectionString
      # Backend -> AI service (server-to-service; token below authenticates).
      # Actual deployed Render hostname (see dashboard); update if the AI service is renamed.
      - key: AI_SERVICE_URL
        value: https://vertexlearn-ai-service-0pts.onrender.com
      # Internal secret: Render generates ONCE here; the ai-service reads the
      # same value via fromService envVarKey (server-side only).
      - key: AI_SERVICE_TOKEN
        generateValue: true
      # Internal auth secrets: separate Render-generated values.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: COOKIE_SECURE
        value: 'true'
      # AI providers: Pollinations is the primary AI Tutor chat route
      # (live-verified working, OpenAI-compatible). Gemini keeps embeddings
      # (gemini-embedding-001 @ VECTOR(1536)); Groq/OpenRouter/Mistral/Gemini
      # chat compat paths stay available. All keys server-side only.
      - key: AI_TUTOR_PROVIDER
        value: pollinations
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: POLLINATIONS_CHAT_MODEL
        value: openai
      - key: POLLINATIONS_BASE_URL
        value: https://text.pollinations.ai/openai
      - key: POLLINATIONS_TIMEOUT_S
        value: 60
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_CHAT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      # Single AI_TUTOR_PROVIDER key (YAML duplicate keys = last-wins: a
      # second entry silently overrode pollinations with openrouter and the
      # hosted Tutor ran on a dead OpenRouter key). Chat fallback credentials
      # stay below WITHOUT a second provider key.
      - key: AI_TUTOR_MODEL
        value: openrouter/free
      - key: AI_TUTOR_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_TUTOR_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: 1536
      - key: RAG_TOP_K
        value: 5
      # Object storage (R2 preferred in production; MinIO stays local).
      # For R2: endpoint https://<account-id>.r2.cloudflarestorage.com,
      # region auto, FORCE_PATH_STYLE false. Buckets must already exist.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_PUBLIC_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: 'false'
      - key: STORAGE_BUCKET_VIDEOS
        value: videos
      - key: STORAGE_BUCKET_MATERIALS
        value: materials
      - key: STORAGE_BUCKET_SUBMISSIONS
        value: submissions
      - key: STORAGE_BUCKET_CERTIFICATES
        value: certificates
      - key: UPLOAD_MAX_MB
        value: 25

  - type: web
    name: vertexlearn-ai-service
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    healthCheckPath: /health
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: vertexlearn-db
          property: connectionString
      # SAME token as the backend: Render injects the backend-generated
      # value (generateValue on vertexlearn-backend) via envVarKey.
      # Empty = no check (dev only); production always receives the value.
      - key: AI_SERVICE_TOKEN
        fromService:
          name: vertexlearn-backend
          type: web
          envVarKey: AI_SERVICE_TOKEN
      - key: AI_TUTOR_PROVIDER
        value: pollinations
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: POLLINATIONS_CHAT_MODEL
        value: openai
      - key: POLLINATIONS_BASE_URL
        value: https://text.pollinations.ai/openai
      - key: POLLINATIONS_TIMEOUT_S
        value: 60
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_CHAT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      # Same single-provider rule as the backend (see above): no second
      # AI_TUTOR_PROVIDER key; OpenRouter rows stay as fallback credentials.
      - key: AI_TUTOR_MODEL
        value: openrouter/free
      - key: AI_TUTOR_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_TUTOR_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: 1536
      - key: RAG_TOP_K
        value: 5
      - key: RAG_CHUNK_SIZE
        value: 800
      - key: RAG_CHUNK_OVERLAP
        value: 200

  # Render-compatible Redis / Key Value. Backend treats REDIS_URL as optional
  # (in-memory fallback), so this service is recommended but not fatal if removed.
  - type: redis
    name: vertexlearn-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: vertexlearn-db
    databaseName: vertexlearn
    user: vertexlearn
    plan: free
